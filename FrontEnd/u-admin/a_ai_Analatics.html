<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Analytics Dashboard</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/stats.css" />
  <style>
    .arrow-up {
      color: #2ecc71;
      font-weight: bold;
      animation: glowUp 1s ease-out;
    }
    .arrow-down {
      color: #e74c3c;
      font-weight: bold;
      animation: dimDown 1s ease-out;
    }
    @keyframes glowUp {
      0% { text-shadow: 0 0 0 #2ecc71; }
      50% { text-shadow: 0 0 8px #2ecc71; }
      100% { text-shadow: 0 0 0 #2ecc71; }
    }
    @keyframes dimDown {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>
</head>
<body>
<header>
  <nav id="main-nav"></nav>
</header>

<main id="dashboard-content">
  <h1>AI Analytics</h1>

  <section id="stats-section">
    <div class="stats-cards">
      <div class="stat-card ai-total-queries">
        <div class="card-icon">🤖</div>
        <h3>Total Queries</h3>
        <p class="stat-value" id="total-ai-queries">0</p>
        <div class="stat-subtext">This month</div>
      </div>

      <div class="stat-card ai-response-time">
        <div class="card-icon">⏱️</div>
        <h3>Avg Response Time</h3>
        <p class="stat-value" id="ai-response-time">0</p>
        <div class="stat-subtext">ms</div>
      </div>

      <div class="stat-card ai-success-rate">
        <div class="card-icon">✅</div>
        <h3>Success Rate</h3>
        <p class="stat-value" id="ai-success-rate">0%</p>
        <div class="stat-subtext">Completed</div>
      </div>
  </section>

  <section>
    <h2>Item Orders All Time (kg vs Last Week)</h2>
    <table class="matrix-chart" id="item-orders-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Monday</th><th>Tuesday</th><th>Wednesday</th>
          <th>Thursday</th><th>Friday</th><th>Saturday</th><th>Sunday</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
<section>
  <h2>Average Orders per Shift by Day</h2>
  <table class="matrix-chart" id="shift-stats-table">
    <thead>
      <tr>
        <th>Day</th>
        <th>Morning</th>
        <th>Afternoon</th>
        <th>Evening</th>
        <th>Night</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>


</main>

<script type="module" src="../js/m_nav_menu.js"></script>
<script>
function animateCount(element, end, duration = 1000) {
  let start = 0;
  const stepTime = Math.max(Math.floor(duration / end), 20);
  const counter = setInterval(() => {
    start += 1;
    element.textContent = start;
    if (start >= end) clearInterval(counter);
  }, stepTime);
}

function getRandom(min, max) {
  return Math.floor(Math.random() * (max - min + 1) + min);
}

document.addEventListener("DOMContentLoaded", () => {
  // Animate AI stats
  animateCount(document.getElementById("total-ai-queries"), getRandom(1200, 1600), 2000);
  animateCount(document.getElementById("ai-response-time"), getRandom(90, 110), 1500);
  animateCount(document.getElementById("ai-success-rate"), getRandom(95, 99), 1800);
  animateCount(document.getElementById("ai-errors"), getRandom(5, 20), 1200);

  // Items and table
  const items = [
    ["🍎 Apple Fuji"], ["🍌 Banana Cavendish"], ["🍊 Orange Navel"],
    ["🍇 Grapes Red Globe"], ["🍓 Strawberry Albion"], ["🍅 Tomato Cherry"],
    ["🥬 Lettuce Romaine"], ["🥒 Cucumber Persian"], ["🥕 Carrot Nantes"], ["🌿 Spinach Baby"]
  ];
  const tbody = document.querySelector("#item-orders-table tbody");

  // We'll keep the static data
  let staticData = [];

  function buildInitialTable() {
    items.forEach(item => {
      let rowData = [];
      for (let i = 0; i < 7; i++) {
        let orders = getRandom(20,50);
        let change = getRandom(-30,30);
        rowData.push({orders, change});
      }
      staticData.push({item: item[0], days: rowData});
    });
    renderTable();
  }

 function renderTable() {
  tbody.innerHTML = "";
  let today = new Date().getDay(); // 0=Sun,1=Mon,...
  today = today === 0 ? 6 : today-1; // align to Mon=0
  staticData.forEach(row => {
    let html = `<tr><td class="item-cell">${row.item}</td>`;
    row.days.forEach((day, idx) => {
      let arrow = day.change >= 0 
        ? `<span class="arrow-up">▲ +${day.change}%</span>`
        : `<span class="arrow-down">▼ ${day.change}%</span>`;
      let cls = (idx === today) ? "highlight-update" : "";
      html += `<td class="${cls}">${day.orders} ${arrow}</td>`;
    });
    html += `</tr>`;
    tbody.innerHTML += html;
  });
}

  // Build table once
  buildInitialTable();

  // Every 6s only update current day
  setInterval(() => {
    let today = new Date().getDay(); // 0=Sun,1=Mon,...6=Sat
    today = today === 0 ? 6 : today-1; // align to our table (Mon=0,...Sun=6)

    staticData.forEach(row => {
      let newChange = getRandom(-30,30);
      row.days[today].change = newChange;
    });

    renderTable();
  }, 6000);
});


const shiftStatsBody = document.querySelector("#shift-stats-table tbody");
const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];


days.forEach(day => {
  let morning = getRandom(90, 110);
  let afternoon = getRandom(85, 110);
  let evening = getRandom(80, 105);
  let night = getRandom(85, 110);

  // calculate random last week changes
  let changeM = getRandom(-20,20);
  let changeA = getRandom(-20,20);
  let changeE = getRandom(-20,20);
  let changeN = getRandom(-20,20);

  let arrowM = changeM >=0 
    ? `<span class="arrow-up">▲ +${changeM}%</span>`
    : `<span class="arrow-down">▼ ${changeM}%</span>`;

  let arrowA = changeA >=0 
    ? `<span class="arrow-up">▲ +${changeA}%</span>`
    : `<span class="arrow-down">▼ ${changeA}%</span>`;

  let arrowE = changeE >=0 
    ? `<span class="arrow-up">▲ +${changeE}%</span>`
    : `<span class="arrow-down">▼ ${changeE}%</span>`;

  let arrowN = changeN >=0 
    ? `<span class="arrow-up">▲ +${changeN}%</span>`
    : `<span class="arrow-down">▼ ${changeN}%</span>`;

  shiftStatsBody.innerHTML += `
    <tr>
      <td>${day}</td>
      <td>${morning} ${arrowM}</td>
      <td>${afternoon} ${arrowA}</td>
      <td>${evening} ${arrowE}</td>
      <td>${night} ${arrowN}</td>
    </tr>
  `;
});


</script>

</body>
</html>
