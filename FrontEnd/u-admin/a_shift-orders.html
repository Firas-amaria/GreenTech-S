<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orders for Shift</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <style>
    #sub-nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 8px 20px;
      background-color: #34495e;
    }

    #sub-nav a {
      color: #ecf0f1;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
    }

    #sub-nav a.sub-active {
      background-color: #2c3e50;
    }

    .summary-item {
      border: 1px solid #ccc;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .summary-header {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sources-list {
      padding-left: 20px;
      margin-top: 5px;
    }

    #orders-table tr:hover {
      background: #f0f0f0;
      cursor: pointer;
    }

    #orders-table td {
      vertical-align: top;
    }

    .canvas {
      width: 400px;
      height: 400px;
    }
  </style>
</head>

<body>
  <header>
    <nav id="main-nav"></nav>
  </header>

  <main>
    <h1>Orders for <span id="shift-info"></span></h1>

    <nav id="sub-nav">
      <ul>
        <li><a href="#" id="summary-tab" class="sub-active">Summary</a></li>
        <li><a href="#" id="orders-tab">Orders</a></li>
      </ul>
    </nav>

    <section id="order-summary-section">
      <div id="summary-title">
        <h2>Order Summaries:</h2>
        <select id="summary-sort">
          <option value="item">Sort by Item</option>
          <option value="farmer">Sort by Farmer</option>
        </select>
      </div>


      <div id="summary-container"></div>
    </section>

    <section id="orders-section" style="display: none;">
      <h2>Orders List</h2>
      <table id="orders-table">
        <thead>
          <tr>
            <th>Order #</th>
            <th>Status</th>
            <th>Total Weight (Kg)</th>
            <th>Total Value</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="item-pie-section" style="max-width: 500px;">
      <h2>Item Distribution</h2>
      <canvas id="itemPieChart" width="400" height="400"></canvas>
      <div id="itemPieLegend" class="pie-legend"></div>
    </section>


  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="module" src="../js/admin-shift-orders.js"></script>
  <script type="module" src="../js/m_nav_menu.js"></script>
</body>

</html>
