<script>
  function animateCount(element, end, duration = 1000) {
  let start = 0;
  const stepTime = Math.abs(Math.floor(duration / end));
  const counter = setInterval(() => {
    start += 1;
    element.textContent = start;
    if (start >= end) clearInterval(counter);
  }, stepTime);
}

// Call it on DOM ready
document.addEventListener("DOMContentLoaded", () => {
  animateCount(document.getElementById("total-orders"), 1243, 2000);
  animateCount(document.getElementById("upcoming-shipments"), 158, 1500);
  
  animateCount(document.getElementById("ai-queries"), 427, 2000);
  
  animateCount(document.getElementById("applications-this-month"), 29, 1500);
});



</script>
