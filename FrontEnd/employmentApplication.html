<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Application</title>

  <!-- Main form CSS -->
  <link rel="stylesheet" href="css/employmentApplication.css" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/maps.css" />
  <!-- Schedule styling (for the embedded schedule table) -->
  <link rel="stylesheet" href="css/schedule.css" />
</head>

<body>
  <header>
  <nav id="main-nav">
    <ul>
      <li><a href="index.html">home</a></li>
      <li class="logout"><a href="#" id="logout-link">Logout</a></li>
    </ul>
  </nav>
</header>
  <h1>Job Application</h1>
  <div id="application-form-container">
    <p>Please check that your personal details we already have are up to date if not sign up with the up to date information.</p>
    <p>This is the mail and phone number we will be using to contact you.</p>

  </div>

  <!--
    We only need one module script here. employmentApplication.js
    will import initSchedule and getScheduleData from schedule.js.
  -->
   
  

  
  <div id="map-modal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); z-index:9999; flex-direction: column; align-items: center; justify-content: center;">
  <input id="map-search" type="text" placeholder="Search location..." style="width:300px; margin:10px;">
  <div id="map" style="width:90%; height:80%; border: 2px solid #ccc;"></div>
  <div style="margin-top:10px;">
    <button id="confirm-location">Use This Location</button>
    <button id="cancel-location">Cancel</button>
  </div>
</div>
  <script type="module" src="js/employmentApplication.js"></script>
</body>
</html>
