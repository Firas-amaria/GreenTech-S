<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Package Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/tm-packages.css" />
  <style>
    .editor-wrap { max-width: 1100px; margin: 18px auto; padding: 0 16px; }
    .editor-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .editor-title { margin:0; font-size:22px; font-weight:800; }
    .two-col { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    @media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }
    .panel { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow: var(--shadow); }
    .panel h3 { margin:0 0 10px 0; font-size:16px; }
    .form-grid { display:grid; grid-template-columns: 1fr; gap:8px; }
    .row { display:grid; grid-template-columns: 200px 1fr; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--border); }
    .row:last-child { border-bottom:none; }
    .row label { color: var(--muted); font-size:13px; }
    .row input { height:36px; border:1px solid var(--border); border-radius:10px; padding:0 10px; }
    .btnbar { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background:#f7f9fb; border:1px solid var(--border); border-radius:12px; padding:10px; overflow:auto; font-size:12px; }
  </style>
  <script src="../js/marketNavBar.js"></script>
</head>
<body>
  <header>
    <nav id="main-nav"></nav>
  </header>
  <div class="editor-wrap">
    <div class="editor-head">
      <h1 class="editor-title" id="title">Package</h1>
      <div class="btnbar">
        <button class="btn" id="btn-reload">Reload</button>
        <button class="btn primary" id="btn-save">Save</button>
      </div>
    </div>

    <div class="two-col">
      <section class="panel">
        <h3>Core (read-only)</h3>
        <div class="form-grid" id="core-rows"></div>
      </section>

      <section class="panel">
        <h3>Edit fields</h3>
        <div class="row">
          <label for="pkg-name">Name</label>
          <input type="text" id="pkg-name" placeholder="Package name" />
        </div>
        <div class="form-grid" id="schema-rows"></div>
      </section>
    </div>

    <section class="panel" style="margin-top:16px;">
      <h3>Raw JSON</h3>
      <pre class="code" id="raw"></pre>
    </section>
  </div>

  <script type="module" src="../js/tm-package-editor.js"></script>
</body>
</html>
