<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shipments | Farmer App</title>
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/farmer-dashboard.css" />


</head>

<body>
  <!-- ===== Sidebar ===== -->
  <nav class="sidebar"></nav>


  <!-- ===== Main Content ===== -->
  <div class="main">
    <h1>Orders Management</h1>

    <!-- ===== Approved Shipments ===== -->
    <div class="section">
      <h2>Confirmed Orders (Next Pickup First)</h2>
      <table id="tblApprovedDash">
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Amount</th>
            <th>Pickup Time</th>
            <th>Location</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- ===== Order Requests ===== -->
    <div class="section">
      <h2>Pending Orders Requests</h2>
      <table id="tblRequestsDash">
        <thead>
          <tr>
            <th>Item</th>
            <th>Amount (kg)</th>
            <th>Pickup Time</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>


  <script type="module" src="../js/w_sidebar_menu.js"></script>
  <script type="module" src="../js/farmer_shipments.js"></script>
</body>

</html>
