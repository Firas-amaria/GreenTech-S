<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crops | Farmer App</title>
  <link rel="stylesheet" href="../css/sidebar.css" />
 <style>
  body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background-color: #f4f9f4;
    color: #333;
  }

  .main {
    padding: 10px;
    margin-left: 10px; /* if sidebar width is 250px */
  }



  .section {
    background-color: #ffffff;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
  }

  label {
    color: #444;
  }

  select,
  input[type="number"],
  input[type="date"] {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    background-color: #fefefe;
  }

  .form-row {
    margin-bottom: 16px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }

  th, td {
    text-align: center;
    padding: 12px;
    border-bottom: 1px solid #ddd;
  }

  th {
    background-color: #e8ebf5;
    color: #24256b;
    font-weight: 600;
  }

  td img {
    width: 60px;
    height: auto;
    border-radius: 6px;
  }

  .btn-primary {
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: background-color 0.3s ease;
  }


  select:focus,
  input:focus,
  button:focus {
    outline: none;
   
  }

  @media (max-width: 768px) {
    .main {
      margin-left: 0;
      padding: 20px;
    }

    table, thead, tbody, th, td, tr {
      display: block;
    
    }

    th, td {
      text-align: left;
    }

    th {
      background-color: #c8d8e6;
    }

    td img {
      margin: 10px 0;
    }
  }
</style>

</head>

<body>
  <nav class="sidebar"></nav>

 <div class="main">
    <h1>Manage Crops</h1>

    <!-- Crops Table -->
    <div class="section">
      <h2>Crop in Selected Land</h2>
      <table id="tblCrops">
        <thead>
          <tr>
            <th>Land</th>
            <th>Item</th>
            <th>Planted Amount</th>
            <th>Planted On</th>
            <th>Status</th>
            <th>Last Updated On</th>
            <th>Percentage</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Add Crop Form (appears after clicking "Add Crops") -->
    <div class="section" id="addCropSection" style="display: none;">
      <h2>Add New Crop</h2>

      <div class="form-row">
        <label for="itemDropdown">Select Crop:</label>
        <select id="itemDropdown"></select>
      </div>
      <div class="form-row">
        <label for="inputPlantedAmt">Planted Amount (kg):</label>
        <input type="number" id="inputPlantedAmt" />
      </div>
      <div class="form-row">
        <label for="avgRatePerUnit">Average Rate Per Unit (kg):</label>
        <input type="number" id="avgRatePerUnit" />
      </div>
      <div class="form-row">
        <label for="fruitingPerPlant">Expected Fruiting per Plant:</label>
        <input type="number" id="fruitingPerPlant" />
      </div>
      <div class="form-row">
        <label for="inputPlantedOn">Planted On:</label>
        <input type="date" id="inputPlantedOn" />
      </div>
      <div class="form-row">
        <label for="expectedHarvestDate">Expected Harvest Date:</label>
        <input type="date" id="expectedHarvestDate" />
      </div>

      <button class="btn-primary" id="btnAddCrop">Add Crop</button>
    </div>
  </div>
  <script src="../js/w_sidebar_menu.js"></script>
  <script src="../js/farmer_crops.js"></script>
</body>

</html>
