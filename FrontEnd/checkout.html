<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/checkout.css" />
</head>
<body>
  <h1>Checkout Summary</h1>
  <div id="checkout-container"></div>
  <div class="total" id="checkout-total"></div>
  <div class="address" id="checkout-address"></div>

  <div style="margin-top: 20px;">
   <div class="visa-payment" style="margin-top: 30px;">
  <h3>Visa Payment Details</h3>

  <label for="card-name">Cardholder Name:</label><br />
  <input type="text" id="card-name" placeholder="Full Name on Card"
         style="padding: 10px; width: 100%; max-width: 400px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ccc;" /><br />

  <label for="visa-card">Card Number:</label><br />
  <input type="text" id="visa-card" placeholder="1234 5678 9012 3456"
         style="padding: 10px; width: 100%; max-width: 400px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ccc;" /><br />

  <label for="exp-date">Expiration Date (MM/YY):</label><br />
  <input type="text" id="exp-date" placeholder="MM/YY"
         style="padding: 10px; width: 160px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ccc;" /><br />

  <label for="cvv">CVV:</label><br />
  <input type="text" id="cvv" placeholder="123"
         style="padding: 10px; width: 100px; margin-bottom: 12px; border-radius: 6px; border: 1px solid #ccc;" />
</div>

  </div>

  <div class="buttons">
    <button onclick="goBack()">Back to Cart</button>
    <button onclick="submitOrder()">Submit Order</button>
  </div>

  <script src="js/checkout.js"></script>
</body>
</html>
