<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Summary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/checkout.css" />
  <style>
    #thank-you-popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#thank-you-popup.hidden {
  display: none;
}

.popup-content {
  background: #fff;
  padding: 30px;
  text-align: center;
  border-radius: 12px;
  position: relative;
  width: 90%;
  max-width: 500px;
  overflow: hidden;
}

#fireworks-canvas {
  width: 100%;
  height: 200px;
  background: transparent;
  margin-top: 15px;
}

.close-btn {
  position: absolute;
  top: 5px;
  right: 12px;
  font-size: 20px;
  cursor: pointer;
}
  </style>
</head>
<body>
  <h1>Checkout Summary</h1>

  <div id="checkout-container">

    
  </div>
  <div class="total" id="checkout-total"></div>
  <div class="address" id="checkout-address"></div>

  <div class="visa-payment">
    <h3>Visa Payment Details</h3>
    <label for="card-name">Cardholder Name:</label>
    <input type="text" id="card-name" placeholder="Full Name on Card" />

    <label for="visa-card">Card Number:</label>
    <input type="text" id="visa-card" placeholder="1234 5678 9012 3456" />

    <label for="exp-date">Expiration Date (MM/YY):</label>
    <input type="text" id="exp-date" placeholder="MM/YY" />

    <label for="cvv">CVV:</label>
    <input type="text" id="cvv" placeholder="123" />
  </div>

  <div class="buttons">
    <button onclick="goBack()">Back to Cart</button>
    <button onclick="submitOrder()">Submit Order</button>
  </div>
  

  <script type="module" src="js/checkout.js"></script>
</body>
</html>
