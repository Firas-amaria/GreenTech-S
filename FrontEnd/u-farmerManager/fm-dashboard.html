<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Farmer Manager Dashboard</title>
  <link rel="stylesheet" href="../css/farmerManager.css">
</head>
<body>
  <h1>Farmer Manager Dashboard</h1>

  <div class="dashboard-grid">
    <div class="section">
      <h2>Upcoming Shifts</h2>
      <div id="next-shifts"></div>
    </div>

    <div class="section">
      <h2>Shipment Requests</h2>
      <div id="shipment-req-summary">
        <p>Loading shipment request summary...</p>
      </div>
      <button onclick="window.location.href='fm-shipment.html'">View Shipment Requests</button>
    </div>

    <div class="section">
      <h2>Placed Orders</h2>
      <div id="orders-summary">
        <p>Loading orders summary...</p>
      </div>
      <button onclick="window.location.href='fm-orders.html'">View Orders</button>
    </div>

    <div class="section">
      <h2>Quick Actions</h2>
      <ul>
        <li><a href="fm-jobApplications.html">Review Job Applicants</a></li>
        <li><a href="fm-activeShipments.html">Active Shipments</a></li>
        <li><a href="fm-farmersList.html">Farmers List</a></li>
        <li><a href="market.html">View Market as Customer</a></li>
        <li><a href="logout.html">Log out</a></li>
      </ul>
    </div>
  </div>

  <script type="module" src="../js/farmerManager.js"></script>
</body>
</html>
