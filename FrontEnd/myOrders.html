<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders</title>
  <link rel="stylesheet" href="./css/myOrders.css" />
  <link rel="stylesheet" href="css/market.css" />
  <style>
.modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  display: none; /* hidden by default */
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: white;
  padding: 20px;
  width: 90%;
  max-width: 700px;
  height: 80%;
  display: flex;
  flex-direction: column;
  border-radius: 8px;
}

#route-map {
  flex: 1;
  width: 100%;
}

#route-info {
  margin-top: 10px;
  font-size: 16px;
}


  </style>
</head>
<body>
  <script src="./js/marketNavBar.js" type="module"></script>
  <main>
  <div class="orders-page">
    <h1>My Orders</h1>

    <div class="order-filters">
      <select id="time-filter">
        <option value="all">All Orders</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
        <option value="custom">Custom Range</option>
      </select>
      <input type="date" id="start-date" style="display: none;">
      <input type="date" id="end-date" style="display: none;">
      <button id="filter-button" style="display: none;">Apply</button>
    </div>

    <div class="orders-list" id="orders-container">
      <p>Loading your orders...</p>
    </div>
  </div>
  </main>
   <div id="route-modal" class="modal">
  <div class="modal-content">
    <div id="route-map"></div>
    <div id="route-info"></div>
    <button id="closebtn" onclick="closeRouteMap()">Close ✖</button>
  </div>
</div>


  <footer class="footer">
    <a href="jobs.html">Job Opportunities</a>
  </footer>

  <script type="module" src="js/myOrders.js"></script>
</body>
</html>
